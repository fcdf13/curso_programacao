[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jf-treino"
version = "0.1.0"
description = "Acompanhamento de treino entre o treinador João Filho e seus alunos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.9",
    "argon2-cffi>=23.1",   # hash de senha
    "itsdangerous>=2.2",   # assina o cookie de sessão (SessionMiddleware)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
jf = "jf.cli:main"

[tool.setuptools.packages.find]
include = ["jf*"]

[tool.setuptools.package-data]
jf = ["dados/*.csv"]

[tool.pytest.ini_options]
# Testes em português, como no resto do repositório.
python_files = ["teste_*.py"]
python_functions = ["teste_*"]
testpaths = ["testes"]
addopts = "-q --no-header -p no:cacheprovider"
