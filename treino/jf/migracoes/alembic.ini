# Configuração do Alembic. A URL do banco NÃO fica aqui: ela vem de
# `jf.config`, para o comando e o servidor nunca apontarem para bancos
# diferentes por descuido.
[alembic]
script_location = %(here)s
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/versoes
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
